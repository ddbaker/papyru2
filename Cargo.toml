[package]
name = "papyru2"
version = "0.68.0"
publish = false
edition = "2024"
build = "build.rs"

[package.metadata.bundle]
name = "papyru2"
identifier = "com.papyru2.app"
icon = [
    "assets/icons/linux/papyru2_16x16.png",
    "assets/icons/linux/papyru2_32x32.png",
    "assets/icons/linux/papyru2_64x64.png",
    "assets/icons/linux/papyru2_128x128.png",
    "assets/icons/linux/papyru2_256x256.png",
    "assets/icons/linux/papyru2_512x512.png",
    "assets/icons/linux/papyru2_1024x1024.png",
    "assets/icons/macos/papyru2_app_icon.icns",
    "assets/icons/windows/papyru2_app_icon.ico",
]

[dependencies]
gpui-kit = { version = "0.11.0", features = ["tree-sitter-languages"] }
raw-window-handle = "=0.6.2"
# The loopback RPC uses irpc's noq transport. Keep iroh available for peer endpoints.
iroh = { version = "*", optional = true }
irpc = { version = "*", features = ["rpc", "derive", "noq_endpoint_setup"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync"] }
filetime = "0.2.29"

anyhow = "1.0.102"
lsp-types = "0.97.0"
chrono = "0.4.44"
smol = "2.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
notify = "8.2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
