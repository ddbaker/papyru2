name: Release Portable Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing git tag to publish portable archives for.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-release:
    name: Resolve release target
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${release_tag}" ]]; then
            echo "::error::No release tag was provided."
            exit 1
          fi

          git fetch --tags --force

          if ! git rev-parse --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::Git tag ${release_tag} does not exist in this repository."
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes ""
          fi

  build-portable:
    name: Build ${{ matrix.platform }} portable zip
    needs: resolve-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libasound2-dev \
            libfontconfig1-dev \
            libgit2-dev \
            libsqlite3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            pkg-config

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Generate application icon assets
        run: cargo run --release --manifest-path tools/generate_app_icons/Cargo.toml

      - name: Verify generated icon assets are committed
        shell: pwsh
        run: |
          $changes = git status --porcelain -- assets/icons

          if ($changes) {
            Write-Output "::error title=Generated icon assets are stale::Icon assets are not updated. Run 'cargo run --release --manifest-path tools/generate_app_icons/Cargo.toml' locally, then commit the regenerated files under assets/icons."
            Write-Output ""
            Write-Output "Changed generated icon files:"
            Write-Output $changes
            exit 1
          }

      - name: Add Windows resource compiler to PATH
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe was not found at $vswhere"
            exit 1
          }

          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) {
            Write-Error "Visual Studio installation path could not be resolved."
            exit 1
          }

          $searchRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'),
            $vsInstallPath
          ) | Where-Object { Test-Path $_ }

          $rcPath = $null
          foreach ($root in $searchRoots) {
            $candidate = Get-ChildItem -Path $root -Filter rc.exe -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]rc\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($candidate) {
              $rcPath = $candidate.FullName
              break
            }
          }

          if (-not $rcPath) {
            Write-Error "rc.exe was not found under the Windows SDK or Visual Studio installation."
            exit 1
          }

          $rcDir = Split-Path -Path $rcPath -Parent
          Add-Content -Path $env:GITHUB_PATH -Value $rcDir
          Write-Output "Using rc.exe from $rcDir"

      - name: Build release binaries
        run: cargo build --release --bin papyru2 --bin papyru2_pin_file --bin papyru2_textfile_import --bin release_portable_packager

      - name: Extract Harper language server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $platform = '${{ matrix.platform }}'
          $assetRoot = Join-Path 'assets' 'harper-ls'
          $targetDir = Join-Path 'target' 'release'
          $extractDir = Join-Path $env:RUNNER_TEMP "harper-ls-$platform-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

          if ($platform -eq 'windows') {
            $archivePath = Join-Path $assetRoot 'harper-ls-x86_64-pc-windows-msvc.zip'
            $binaryName = 'harper-ls.exe'
            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDir -Force
          } elseif ($platform -eq 'linux') {
            $archivePath = Join-Path $assetRoot 'harper-ls-x86_64-unknown-linux-gnu.tar.gz'
            $binaryName = 'harper-ls'
            tar -xzf $archivePath -C $extractDir
          } elseif ($platform -eq 'macos') {
            $archivePath = Join-Path $assetRoot 'harper-ls-x86_64-apple-darwin.tar.gz'
            $binaryName = 'harper-ls'
            tar -xzf $archivePath -C $extractDir
          } else {
            throw "Unsupported platform: $platform"
          }

          $binary = Get-ChildItem -LiteralPath $extractDir -Recurse -File -Filter $binaryName | Select-Object -First 1
          if (-not $binary) {
            throw "Harper archive $archivePath does not contain $binaryName."
          }

          $destination = Join-Path $targetDir $binaryName
          Copy-Item -LiteralPath $binary.FullName -Destination $destination -Force
          if ($platform -ne 'windows') {
            chmod +x $destination
          }

          Write-Output "Extracted $binaryName from $archivePath to $destination."

      - name: Create portable zip
        run: cargo run --release --bin release_portable_packager -- --platform ${{ matrix.platform }} --bin-dir target/release --output-dir dist --config-path conf/papyru2_conf.toml

      - name: Verify Harper and license files in portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath dist -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) {
            throw 'No portable zip was produced.'
          }

          $platform = '${{ matrix.platform }}'
          $harperEntry = if ($platform -eq 'windows') {
            'bin/harper-ls.exe'
          } else {
            'bin/harper-ls'
          }
          $requiredEntries = @(
            $harperEntry,
            'licenses/LICENSE',
            'licenses/THIRD_PARTY_NOTICES.md',
            'licenses/harper/LICENSE-Apache-2.0.txt'
          )

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            foreach ($entry in $requiredEntries) {
              $matched = $archive.Entries | Where-Object { $_.FullName -like "*/$entry" }
              if (-not $matched) {
                throw "Portable zip $($zip.Name) does not contain $entry."
              }
              Write-Output "Verified $entry in $($zip.Name)."
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: papyru2-${{ matrix.platform }}-portable-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish-release-assets:
    name: Publish release assets
    needs:
      - resolve-release
      - build-portable
    runs-on: ubuntu-24.04
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-artifacts

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          assets=(dist-artifacts/**/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No portable zip assets were found."
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
